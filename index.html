<!doctype html>

<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>
      MVP Development with AI II | B07/26 · Module 3: Software Engineering with
      AI | DL School
    </title>
    <link
      href="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/reset.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/reveal.css"
      rel="stylesheet"
    />
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&amp;family=Inter:wght@400;500;600;700;800;900&amp;family=JetBrains+Mono:wght@400;600&amp;family=Lato:wght@400;700&amp;family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&amp;display=swap"
      rel="stylesheet"
    />
    <link href="css/deck.css" rel="stylesheet" />
  </head>
  <body>
    <div class="reveal">
      <div class="slides"></div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/reveal.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/plugin/notes/notes.js"></script>
    <script src="js/boot.js"></script>
    <script src="i18n.js"></script>
    <!-- ─── Language switch + footer credit ───────────────── -->
    <div id="deck-chrome-left">
      <div aria-label="Language" id="lang-switch" role="group">
        <button
          aria-pressed="true"
          class="is-active"
          data-lang-option="en"
          type="button"
        >
          EN
        </button>
        <button aria-pressed="false" data-lang-option="de" type="button">
          DE
        </button>
      </div>
      <span id="slide-footer-credit"
        >DL School · B07/26 · Module 3 · MVP Development with AI II</span
      >
    </div>
    <!-- ─── Slide Navigator ───────────────────────────────────── -->
    <button id="nav-btn" onclick="navToggle()" title="Slide navigator (G)">
      <svg
        fill="none"
        height="14"
        viewbox="0 0 18 14"
        width="18"
        xmlns="http://www.w3.org/2000/svg"
      >
        <rect fill="currentColor" height="2" rx="1" width="18"></rect>
        <rect fill="currentColor" height="2" rx="1" width="18" y="6"></rect>
        <rect fill="currentColor" height="2" rx="1" width="18" y="12"></rect>
      </svg>
    </button>
    <div id="nav-overlay" onclick="if (event.target === this) navClose();">
      <div id="nav-panel">
        <div id="nav-head">
          <span>Slide navigator</span>
          <button onclick="navClose()">
            <svg
              fill="none"
              height="14"
              viewbox="0 0 14 14"
              width="14"
              xmlns="http://www.w3.org/2000/svg"
            >
              <path
                d="M1 1L13 13M13 1L1 13"
                stroke="currentColor"
                stroke-linecap="round"
                stroke-width="2"
              ></path>
            </svg>
          </button>
        </div>
        <div id="nav-list"></div>
        <div id="nav-foot">
          Press <kbd>G</kbd> navigator · <kbd>S</kbd> speaker view ·
          <kbd>Esc</kbd> close
        </div>
      </div>
    </div>
    <script src="js/nav.js"></script>
  </body>
</html>
